name: Release manager
on:
  push:
    tags: ['manager-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/smoke.py
      - run: python scripts/group_priority_smoke.py
      - run: python scripts/allocation_input_smoke.py
      - run: python scripts/scan_copies_smoke.py
      - run: python scripts/maintenance_smoke.py
      - run: python scripts/early_smoke.py
      - run: python scripts/subscription_smoke.py
      - run: python scripts/package_manager.py
      - name: Keep the verified package for recovery
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: OhMyZZZ-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/OhMyZZZ-${GITHUB_REF_NAME#manager-v}.zip" "dist/OhMyZZZ-${GITHUB_REF_NAME#manager-v}.zip.sha256" --title "OhMyZZZ ${GITHUB_REF_NAME#manager-v}" --verify-tag --generate-notes --prerelease
